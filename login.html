<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5A8BE6">
    <meta name="robots" content="noindex, nofollow">

    <title>관리자 로그인 | 태커</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=1789000000">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/favicon-180.png">

</head>

<body>

<div class="init-loader" id="initLoader" aria-hidden="true">
    <span class="init-loader-mark">태커</span>
    <span class="init-loader-spinner"></span>
</div>

<div class="login-page">

    <div class="login-background">
        <div class="bg-gradient gradient-blue"></div>
        <div class="bg-gradient gradient-sky"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="login-container" style="max-width:420px; margin:0 auto; padding:2rem 1rem;">

        <div class="card" style="padding:1.5rem;">

            <h2 style="margin-bottom:6px;">관리자 로그인</h2>
            <p style="color:var(--sub); font-size:13px; margin-bottom:18px;">
                태커는 로그인 없이 쓸 수 있어요. 이 페이지는 관리자 전용이에요.
            </p>

            <form id="loginForm" autocomplete="on">

                <div class="form-group">
                    <label for="email">이메일</label>
                    <div class="input-box">
                        <input id="email" name="email" type="email" class="input" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="input-box">
                        <input id="password" name="password" type="password" class="input" required autocomplete="current-password">
                    </div>
                </div>

                <p class="input-message" id="loginMessage" style="min-height:1.2em;"></p>

                <button id="loginButton" class="btn" type="submit" style="width:100%;">
                    <span class="button-text">로그인</span>
                </button>

            </form>

            <p style="margin-top:14px; text-align:center;">
                <a href="index.html" class="text-link">← 홈으로</a>
            </p>

        </div>

    </div>

</div>

<div id="overlay" class="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=1789000000"></script>
<script src="js/auth.js?v=1789000000"></script>
<script>
(function(){

    const form=document.getElementById("loginForm");
    const msg=document.getElementById("loginMessage");
    const btn=document.getElementById("loginButton");

    /* 이미 관리자로 로그인되어 있으면 바로 관리자 패널로 */
    window.addEventListener("load",async()=>{

        try{

            if(window.Auth && await window.Auth.isAdmin()) location.replace("admin.html");

        }

        catch(error){ /* 무시 */ }

    });

    form.addEventListener("submit",async(e)=>{

        e.preventDefault();

        msg.textContent="";
        btn.disabled=true;

        try{

            await window.Auth.login(form.email.value.trim(),form.password.value);

            location.href="admin.html";

        }

        catch(error){

            msg.textContent=error.message || "로그인에 실패했어요.";
            msg.style.color="#DC2626";

        }

        finally{

            btn.disabled=false;

        }

    });

})();
</script>

</body>

</html>
