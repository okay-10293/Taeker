                <span class="profile-trigger-name" id="headerNickname">회원</span>

     MAIN
===================================================== -->
<main class="container">

    <section class="board-title">
        <h2>달력</h2>
        <p>누구나 수행평가 등 중요한 일정을 추가할 수 있어요.</p>
    </section>

    <div class="cal-nav school-date-nav">
        <button class="icon-btn" id="calPrev" aria-label="이전 달">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="school-date-label" id="calLabel"></span>
        <button class="icon-btn" id="calNext" aria-label="다음 달">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-outline" id="calToday" style="margin-left:auto;">오늘</button>
    </div>

    <div class="card cal-card">
        <div class="cal-week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
        <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card cal-day">
        <div class="cal-day-head">
            <h3 id="calDayTitle"></h3>
            <button class="btn cal-primary" id="calAddBtn" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>일정 추가</span>
            </button>
        </div>
        <div id="calDayList"></div>
    </div>

</main>

<div class="modal" id="calModal" role="dialog" aria-modal="true" aria-labelledby="calModalTitle">
    <div class="modal-content cal-modal">
        <h3 id="calModalTitle">일정 추가</h3>
        <form id="calForm" autocomplete="off">
            <label class="cal-field">날짜<input class="input" type="date" id="calDate" required></label>
            <label class="cal-field">제목<input class="input" type="text" id="calTitle" maxlength="40" placeholder="예: 수학 수행평가" required></label>
            <label class="cal-field">메모 (선택)<textarea class="input" id="calMemo" maxlength="300" rows="3" placeholder="자세한 내용"></textarea></label>
            <div class="cal-row">
                <label class="cal-field">닉네임<input class="input" type="text" id="calNick" maxlength="12" placeholder="익명" required></label>
                <label class="cal-field">비밀번호<input class="input" type="password" id="calPw" minlength="4" maxlength="30" placeholder="삭제할 때 필요" required></label>
            </div>
            <p class="cal-hint">비밀번호는 일정을 삭제할 때만 쓰여요. 잊어버리면 삭제할 수 없으니 기억해두세요.</p>
            <div class="cal-actions">
                <button type="button" class="btn btn-outline" id="calCancel">취소</button>
                <button type="submit" class="btn cal-primary" id="calSubmit">등록</button>
            </div>
        </form>
    </div>
</div>

<button class="fab" id="writeBtn" aria-label="글쓰기">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">

</button>
