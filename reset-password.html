<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#2563EB">

    <meta name="robots" content="noindex">

    <title>

        비밀번호 재설정 | Taeker

    </title>

    <link
        rel="stylesheet"
        href="css/style.css?v=1786895477">

</head>

<body>

<div class="init-loader" id="initLoader" aria-hidden="true">
    <span class="init-loader-mark">태커</span>
    <span class="init-loader-spinner"></span>
</div>

<div class="login-page">

    <div class="login-background">

        <div class="bg-gradient gradient-blue"></div>

        <div class="bg-gradient gradient-sky"></div>

        <div class="bg-grid"></div>

    </div>

    <main class="login-layout" style="grid-template-columns:1fr;justify-content:center;">

        <section class="login-panel">

            <div class="login-card" id="resetPasswordLoading">

                <div class="login-header">

                    <span class="login-badge">
                        Taeker
                    </span>

                    <h2>
                        링크를 확인하는 중입니다
                    </h2>

                    <p>
                        잠시만 기다려주세요...
                    </p>

                </div>

            </div>

            <div class="login-card hidden" id="resetPasswordCard">

                <div class="login-header">

                    <span class="login-badge">
                        비밀번호 재설정
                    </span>

                    <h2>
                        새 비밀번호 설정
                    </h2>

                    <p>
                        새로 사용할 비밀번호를 입력해주세요.
                    </p>

                </div>

                <form id="resetPasswordForm" class="login-form" autocomplete="off">

                    <div class="form-group">

                        <label for="newPassword">
                            새 비밀번호
                        </label>

                        <div class="input-box">

                            <input
                                id="newPassword"
                                name="newPassword"
                                type="password"
                                class="input"
                                placeholder="6자 이상 입력하세요"
                                autocomplete="new-password"
                                required>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="newPasswordConfirm">
                            새 비밀번호 확인
                        </label>

                        <div class="input-box">

                            <input
                                id="newPasswordConfirm"
                                name="newPasswordConfirm"
                                type="password"
                                class="input"
                                placeholder="비밀번호를 한 번 더 입력하세요"
                                autocomplete="new-password"
                                required>

                        </div>

                        <small id="resetPasswordMessage" class="input-message"></small>

                    </div>

                    <button
                        id="resetPasswordButton"
                        class="btn login-button"
                        type="submit">

                        <span class="button-text">
                            비밀번호 변경
                        </span>

                    </button>

                </form>

            </div>

            <div class="login-card hidden" id="resetPasswordInvalid">

                <div class="login-header">

                    <span class="login-badge">
                        Taeker
                    </span>

                    <h2>
                        링크가 만료되었습니다
                    </h2>

                    <p>
                        비밀번호 재설정 링크가 유효하지 않거나
                        이미 사용되었습니다.<br>
                        로그인 화면에서 다시 요청해주세요.
                    </p>

                </div>

                <a href="login.html" class="btn login-button" style="display:flex;justify-content:center;text-decoration:none;margin-top:8px;">
                    로그인으로 돌아가기
                </a>

            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=1786895477"></script>
<script src="js/auth.js?v=1786895477"></script>
<script src="js/reset-password.js?v=1786895477"></script>

</body>

</html>
